_target_: main.module_base_latent_cond.Datamodule
dataset:
  _target_: audio_data_pytorch.WAVDataset
  recursive: True
  instruments: ${instruments}
  path: ${dataset_path}
  sample_rate: ${sampling_rate}
  # Crop in the dataset (not only in AllTransform) so it knows WHERE the crop
  # started and can slice the MIDI piano roll to the same window. The RandomCrop
  # inside transforms then sees an already-correct length and is a no-op; it
  # still zero-pads tracks shorter than ${length}.
  random_crop_size: ${length}
  midi_fps: 75
  midi_cache_root: ${oc.select:midi_cache_root,null}
  # true pairs each clip with another track's roll (the control condition)
  midi_shuffle: false
  transforms:
    _target_: audio_data_pytorch.AllTransform
    random_crop_size: ${length}
    sign: ${sign}
    # #yuval added 2 lines
    # add_fifth: true
    # fifth_gain: 0.8
val_split: 0.2
batch_size: 32
num_workers: 32
pin_memory: True
